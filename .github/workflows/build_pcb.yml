name: Build XiaoZhi Custom PCB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and Build
        run: |
          idf.py set-target esp32s3
          echo "CONFIG_BOARD_TYPE_BREAD_COMPACT_WIFI=y" >> sdkconfig.defaults
          echo "CONFIG_OLED_SH1106_128X64=y" >> sdkconfig.defaults
          echo "CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y" >> sdkconfig.defaults
          echo "CONFIG_ESPTOOLPY_FLASHSIZE=\"4MB\"" >> sdkconfig.defaults
          rm -f sdkconfig
          idf.py build

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-supermini-pcb
          path: build/merged-binary.bin
