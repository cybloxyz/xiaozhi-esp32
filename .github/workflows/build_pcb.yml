name: Build XiaoZhi Custom PCB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and Build
        run: |
          . $IDF_PATH/export.sh
          rm -rf managed_components
          cat << 'EOF' > sdkconfig.custom
          CONFIG_BOARD_TYPE_BREAD_COMPACT_WIFI=y
          CONFIG_OLED_SH1106_128X64=y
          CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
          CONFIG_ESPTOOLPY_FLASHSIZE="4MB"
          CONFIG_PARTITION_TABLE_CUSTOM=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v1/4m.csv"
          EOF
          export CONFIG=sdkconfig.custom
          idf.py set-target esp32s3
          idf.py build

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-supermini-pcb
          path: build/merged-binary.bin
